# Producción diaria (04:30 Europe/Madrid). GitHub cron va en UTC y puede llegar horas tarde o saltarse una pasada
# (22-10-2026: el de las 04:30 llegó a las 09:49 y no hubo vídeo). Por eso hay pasadas de respaldo hasta la tarde:
# madrid-gate --once deja pasar la primera que caiga en la ventana y descarta las demás si hoy ya se empezó.
#
# Aislamiento (el modelo lee webs no confiables y su escena se compila con webpack):
#   write  · Claude escribe guion y escena. Token de Claude, sin GITHUB_TOKEN útil, no ejecuta nada.
#   build  · voz, compilación y render del código del modelo. SIN ningún secreto.
#   review · Claude mira los fotogramas. Solo lectura + su informe.
#   save   · checkout limpio: copia del artefacto solo lo esperado (pipeline/collect.mjs), release y commit en main.
# Entre jobs, cada uno recoge el artefacto del anterior con collect.mjs (nunca lo extrae encima del repo).
# Los artefactos de un repo público los puede descargar cualquiera con cuenta: llevan lo mismo que la release del día.
name: produce
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      date: { description: "Fecha YYYY-MM-DD (vacío = hoy en Madrid)", required: false }
concurrency: { group: curiosity-engine, cancel-in-progress: false }
permissions: {}   # cada job pide lo suyo
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs: { go: "${{ steps.gate.outputs.go }}", date: "${{ steps.d.outputs.date }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: ¿Toca hoy? (hora de Madrid y parada de emergencia)
        id: gate
        # De 04:00 a 18:00 de Madrid (la última pasada termina antes de la ventana de publicación, que abre a las 19:30).
        run: node pipeline/madrid-gate.mjs --window 04:00-18:00 --once ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} >> "$GITHUB_OUTPUT"
      - name: Fecha del run
        id: d
        env: { INPUT_DATE: "${{ inputs.date }}", TODAY: "${{ steps.gate.outputs.date }}" }   # por env, nunca interpolado (inyección)
        run: |
          D=${INPUT_DATE:-$TODAY}
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::fecha inválida"; exit 1; }
          echo "date=$D" >> "$GITHUB_OUTPUT"

  write:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions: { contents: read }
    env: { D: "${{ needs.gate.outputs.date }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, persist-credentials: false }   # sin token en .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: npm i -g @anthropic-ai/claude-code@2.1.305   # versión fija (las banderas de permisos se probaron con esta)
      - name: Banco de ganchos (contenido de pago, fuera del repo público)
        env: { HOOKS_MD: "${{ secrets.HOOKS_MD }}" }
        run: |
          [ -n "$HOOKS_MD" ] || { echo "::error::falta el secreto HOOKS_MD (assets/hooks/hooks.md)"; exit 1; }
          mkdir -p assets/hooks   # la carpeta no está en git (su único archivo es privado)
          printf '%s\n' "$HOOKS_MD" > assets/hooks/hooks.md
      - name: ATLAS (investigar → guion)
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: node pipeline/atlas.mjs --date "$D" --stages RESEARCHING,SCRIPTING
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: state-write
          retention-days: 1
          if-no-files-found: warn
          path: |
            data/
            episodes/
            remotion/src/episodes/

  build:
    needs: [gate, write]
    if: needs.write.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read }
    env: { D: "${{ needs.gate.outputs.date }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: state-write, path: incoming }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: node pipeline/collect.mjs incoming "$D" SCRIPTING && rm -rf incoming
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: { path: ~/.cache/huggingface, key: hf-voxcpm2-whisper-small-v1 }
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          npm ci --no-audit --no-fund
          pip install -q -r requirements.txt
      - name: ATLAS (voz → render → calidad técnica)
        env: { CE_PYTHON: python, CE_CONCURRENCY: "4" }
        run: node pipeline/atlas.mjs --date "$D" --stages VOICE,RENDERING,QUALITY_CHECK
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: state-build
          retention-days: 1
          if-no-files-found: warn
          path: |
            data/
            episodes/
            remotion/src/episodes/
            public/audio/
            public/music/
            work/
            !work/**/*.log
            !work/**/voice.wav

  review:
    needs: [gate, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    env: { D: "${{ needs.gate.outputs.date }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: state-build, path: incoming }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: node pipeline/collect.mjs incoming "$D" QUALITY_CHECK && rm -rf incoming
      - run: npm i -g @anthropic-ai/claude-code@2.1.305
      - name: SENTINEL (revisión visual)
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: node pipeline/atlas.mjs --date "$D" --stages VISUAL_REVIEW
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: state-review
          retention-days: 1
          if-no-files-found: warn
          path: |
            data/
            episodes/
            remotion/src/episodes/
            public/audio/
            public/music/
            work/
            !work/frames/
            !work/**/*.log

  save:
    needs: [gate, write, build, review]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write, issues: write }
    env: { D: "${{ needs.gate.outputs.date }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true   # un job que no llegó a arrancar no deja artefacto
        with: { pattern: state-*, path: incoming }
      - name: Recoger lo producido (solo rutas esperadas del día)
        run: |
          # el último paso de cada job: lo posterior se toma de main, nunca del artefacto
          for s in review:VISUAL_REVIEW build:QUALITY_CHECK write:SCRIPTING; do
            if [ -d "incoming/state-${s%%:*}" ]; then node pipeline/collect.mjs "incoming/state-${s%%:*}" "$D" "${s#*:}"; break; fi
          done
          rm -rf incoming
      - name: Subir el vídeo como release (lo recoge el job de publicación)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          EP=$(node -e "const r=require('./data/runs/'+process.argv[1]+'.json');console.log(r.state==='READY'?r.episode:'')" "$D" 2>/dev/null || true)
          [ -n "$EP" ] && [ -f "work/$EP/$EP.mp4" ] || { echo "no hay vídeo READY que subir"; exit 0; }
          # Nunca se sustituye un vídeo ya publicado
          if gh release view "ep-$D" >/dev/null 2>&1; then
            node -e "const r=require('./data/runs/'+process.argv[1]+'.json');process.exit(Object.values(r.platforms??{}).some(p=>p.status==='published')?1:0)" "$D" || { echo "ep-$D ya publicado: no se toca"; exit 0; }
            gh release upload "ep-$D" "work/$EP/$EP.mp4" "work/$EP/quality.json" --clobber
          else
            gh release create "ep-$D" "work/$EP/$EP.mp4" "work/$EP/quality.json" --title "$D · $EP" --notes "Vídeo del $D (estado en data/runs/$D.json)"
          fi
      - name: Guardar estado (y alertas → issues)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash pipeline/save-state.sh "run $D" data episodes remotion/src/episodes public
